services:
  - type: web
    name: sobutylnik
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    disk:
      name: sobutylnik-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DB_PATH
        value: /var/data/sobutylnik.db
      - key: PYTHON_VERSION
        value: "3.11"
